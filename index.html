<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rafly ❤️ Shinta</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="hero">
  <h1>Rafly ❤️ Shinta</h1>
  <p>Happy 2nd Anniversary</p>
  <button id="startBtn">Open Our Story ❤️</button>
</div>

<section id="nextSection" style="display:none">
  <h2>Our Journey</h2>

  <div class="counter">
    <div><span id="days">0</span><br/>Hari</div>
    <div><span id="hours">0</span><br/>Jam</div>
    <div><span id="minutes">0</span><br/>Menit</div>
    <div><span id="seconds">0</span><br/>Detik</div>
  </div>

  <h2>📸 Our Memories</h2>
  <img id="slide" src="assets/photos/1.jpg" alt="memory" />
  <p id="caption">Awal dari semua cerita kita ❤️</p>
</section>

<button id="musicBtn">🎵</button>

<audio id="bgMusic" loop preload="auto">
  <source src="assets/music/lagu.mp3" type="audio/mpeg" />
</audio>

<script src="script.js"></script>
</body>
</html>
